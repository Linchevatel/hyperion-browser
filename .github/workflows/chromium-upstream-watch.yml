name: Chromium Upstream Watcher

on:
  schedule:
    - cron: "0 2 * * *" # Daily check at 02:00 UTC
  workflow_dispatch:     # Manual run trigger

jobs:
  check-upstream:
    name: Check Clean Chromium Core Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch Upstream Version
        id: check_version
        run: |
          # Check latest Clean Chromium release
          UNGOOGLED_VER=$(curl -s "https://api.github.com/repos/ungoogled-software/ungoogled-chromium-portablelinux/releases/latest" | jq -r '.tag_name // empty')
          
          # Fallback to ChromiumDash stable if API rate-limited
          if [ -z "$UNGOOGLED_VER" ] || [ "$UNGOOGLED_VER" = "null" ]; then
            UNGOOGLED_VER=$(curl -s "https://chromiumdash.appspot.com/fetch_releases?channel=Stable&platform=Linux" | jq -r '.[0].version // empty')
          fi

          echo "Detected Upstream Chromium: $UNGOOGLED_VER"
          CURRENT_VER="none"
          if [ -f "CHROMIUM_VERSION" ]; then
            CURRENT_VER=$(cat CHROMIUM_VERSION | tr -d '[:space:]')
          fi
          echo "Current Tracked Version: $CURRENT_VER"
          echo "upstream_version=$UNGOOGLED_VER" >> $GITHUB_OUTPUT
          echo "current_version=$CURRENT_VER" >> $GITHUB_OUTPUT
          
          if [ -n "$UNGOOGLED_VER" ] && [ "$UNGOOGLED_VER" != "null" ] && [ "$UNGOOGLED_VER" != "$CURRENT_VER" ]; then
            echo "new_version_found=true" >> $GITHUB_OUTPUT
          else
            echo "new_version_found=false" >> $GITHUB_OUTPUT
          fi

      - name: Bump Hyperion Version and Tag Release
        if: steps.check_version.outputs.new_version_found == 'true'
        run: |
          NEW_CHROMIUM_VER="${{ steps.check_version.outputs.upstream_version }}"
          echo "$NEW_CHROMIUM_VER" > CHROMIUM_VERSION

          git config user.name "Linchevatel"
          git config user.email "295051633+Linchevatel@users.noreply.github.com"

          # Increment Hyperion desktop patch version (e.g. 1.0.8 -> 1.0.9)
          npm version patch --no-git-tag-version
          NEW_APP_VER=$(node -p "require('./package.json').version")
          echo "Bumping Hyperion to v$NEW_APP_VER with Clean Chromium $NEW_CHROMIUM_VER"

          # Update version display in index.html
          sed -i "s/Hyperion v[0-9.]\+/Hyperion v$NEW_APP_VER/g" index.html
          sed -i "s/settings-app-version\">v[0-9.]\+/settings-app-version\">v$NEW_APP_VER/g" index.html

          git add CHROMIUM_VERSION package.json package-lock.json index.html
          git commit -m "chore(release): bump Hyperion to v$NEW_APP_VER (Chromium core $NEW_CHROMIUM_VER)"
          git tag -a "v$NEW_APP_VER" -m "Hyperion Browser v$NEW_APP_VER (Clean Chromium $NEW_CHROMIUM_VER)"
          git push origin main --tags

