name: Build and Release Hyperion Browser

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag (e.g. v1.0.0)"
        required: false
        default: ""
  push:
    tags:
      - "v*"

jobs:
  # ── Linux: compile patched Chromium + package Hyperion ─────────────────
  build-linux:
    name: Build Hyperion Linux (.AppImage, .deb, .rpm)
    runs-on: [self-hosted, linux, chromium-builder]
    timeout-minutes: 600

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install NPM Dependencies
        run: npm install

      # ── Compile Chromium from source with Hyperion patch ───────────────
      - name: Resolve Chromium Version
        id: chromium_ver
        run: |
          VER=$(cat CHROMIUM_VERSION | tr -d '[:space:]')
          SRC_VER="${VER%%-*}"
          echo "full=$VER"    >> $GITHUB_OUTPUT
          echo "src=$SRC_VER" >> $GITHUB_OUTPUT
          echo "Building Chromium $SRC_VER for Hyperion..."

      - name: Sync Chromium Source
        run: |
          CHROMIUM_SRC="${CHROMIUM_BUILD_DIR:-/build/chromium}/src"
          cd "$(dirname $CHROMIUM_SRC)"
          if [ ! -f "$CHROMIUM_SRC/DEPS" ]; then
            fetch --nohooks chromium
          fi
          cd "$CHROMIUM_SRC"
          gclient sync --with_branch_heads --reset --force \
            --delete_unversioned_trees -r "src@${{ steps.chromium_ver.outputs.src }}"
          gclient runhooks

      - name: Apply Hyperion Fingerprint Patch
        run: |
          CHROMIUM_SRC="${CHROMIUM_BUILD_DIR:-/build/chromium}/src"
          PATCH_FILE="${GITHUB_WORKSPACE}/patches/hyperion_core_fingerprint.patch"
          cd "$CHROMIUM_SRC"
          git checkout -- .
          if ! git apply --check "$PATCH_FILE" 2>/dev/null; then
            echo "::error::Patch does not apply cleanly to Chromium ${{ steps.chromium_ver.outputs.src }}"
            exit 1
          fi
          git apply "$PATCH_FILE"
          echo "Patch applied successfully."

      - name: Configure GN Build
        run: |
          export PATH="/opt/depot_tools:$PATH"
          CHROMIUM_SRC="${CHROMIUM_BUILD_DIR:-/build/chromium}/src"
          OUT_DIR="$CHROMIUM_SRC/out/Release"
          if [ ! -f "$OUT_DIR/args.gn" ]; then
            mkdir -p "$OUT_DIR"
            cat > "$OUT_DIR/args.gn" << 'EOF'
          is_official_build = true
          is_debug = false
          symbol_level = 0
          enable_nacl = false
          blink_symbol_level = 0
          v8_symbol_level = 0
          chrome_pgo_phase = 0
          use_thin_lto = false
          use_lld = true
          is_chrome_branded = false
          safe_browsing_mode = 0
          enable_reporting = false
          enable_background_mode = false
          google_api_key = ""
          google_default_client_id = ""
          google_default_client_secret = ""
          EOF
            cd "$CHROMIUM_SRC"
            gn gen "$OUT_DIR"
          fi

      - name: Compile Chromium
        run: |
          export PATH="/opt/depot_tools:$PATH"
          OUT_DIR="${CHROMIUM_BUILD_DIR:-/build/chromium}/src/out/Release"
          cd "${CHROMIUM_BUILD_DIR:-/build/chromium}/src"
          autoninja -C "$OUT_DIR" chrome

      # ── Copy compiled binary into Electron bundle dir ──────────────────
      - name: Bundle Patched Chromium into Hyperion
        run: |
          OUT_DIR="${CHROMIUM_BUILD_DIR:-/build/chromium}/src/out/Release"
          BUNDLE_DIR="${GITHUB_WORKSPACE}/bundle/chrome"
          mkdir -p "$BUNDLE_DIR"

          COPY_FILES=(
            chrome
            chrome_100_percent.pak chrome_200_percent.pak resources.pak
            icudtl.dat v8_context_snapshot.bin
            libEGL.so libGLESv2.so libvk_swiftshader.so libvulkan.so.1
            vk_swiftshader_icd.json
          )
          for f in "${COPY_FILES[@]}"; do
            [ -f "$OUT_DIR/$f" ] && cp "$OUT_DIR/$f" "$BUNDLE_DIR/" || true
          done
          cp -r "$OUT_DIR/locales" "$BUNDLE_DIR/"
          chmod +x "$BUNDLE_DIR/chrome"

          echo "Bundled Chromium ${{ steps.chromium_ver.outputs.full }} → $BUNDLE_DIR"
          ls -lh "$BUNDLE_DIR/chrome"

      # ── Build Hyperion installer packages ─────────────────────────────
      - name: Install System Packaging Tools
        run: |
          which rpm && which fpm || {
            sudo apt-get update -qq
            sudo apt-get install -y rpm ruby ruby-dev rubygems libarchive-tools
            sudo gem install --no-document fpm
          }

      - name: Build Linux Installers (.AppImage, .deb, .rpm)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run dist:linux

      - name: Upload Linux Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: hyperion-linux
          retention-days: 1
          path: |
            dist/*.AppImage
            dist/*.deb
            dist/*.rpm

  # ── Windows: package Hyperion (.exe NSIS & Portable) ───────────────────
  build-windows:
    name: Build Hyperion Windows (.exe)
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install NPM Dependencies
        run: npm install

      - name: Download Bundled Chromium Core (Windows)
        run: node scripts/download_engine.js --platform=win64

      - name: Build Windows Installers (.exe)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run dist:win

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: hyperion-windows
          retention-days: 1
          path: dist/*.exe

  # ── Patch archive (for transparency / open source) ─────────────────────
  package-patches:
    name: Package Patches Archive
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Validate Patch File
        run: |
          if [ ! -f "patches/hyperion_core_fingerprint.patch" ]; then
            echo "::error::patches/hyperion_core_fingerprint.patch is missing!"
            exit 1
          fi
          echo "Patch OK: $(wc -l < patches/hyperion_core_fingerprint.patch) lines"

      - name: Create Patches Archive
        run: |
          mkdir -p _pkg
          cp -r fonts   _pkg/
          cp -r patches _pkg/
          cp CHROMIUM_VERSION _pkg/
          tar -czvf hyperion-patches-and-fonts.tar.gz -C _pkg .

      - name: Upload Patches Archive
        uses: actions/upload-artifact@v4
        with:
          name: hyperion-patches
          retention-days: 1
          path: hyperion-patches-and-fonts.tar.gz

  # ── Publish final Hyperion GitHub Release ──────────────────────────────
  create-github-release:
    name: Publish Hyperion Release
    needs: [build-linux, build-windows, package-patches]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-binaries/
          merge-multiple: true

      - name: Generate SHA-256 Checksums
        run: |
          cd release-binaries
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Determine Release Tag and Chromium Version
        id: meta
        run: |
          CHROME_VER=$(cat CHROMIUM_VERSION | tr -d '[:space:]')
          echo "chrome_ver=$CHROME_VER" >> $GITHUB_OUTPUT

          if [[ "${{ github.ref_name }}" == v* ]]; then
            echo "tag=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          elif [ -n "${{ inputs.release_tag }}" ]; then
            echo "tag=${{ inputs.release_tag }}" >> $GITHUB_OUTPUT
          else
            APP_VER=$(node -p "require('./package.json').version")
            echo "tag=v${APP_VER}" >> $GITHUB_OUTPUT
          fi

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name:   ${{ steps.meta.outputs.tag }}
          name:       "Hyperion Browser ${{ steps.meta.outputs.tag }}"
          files:      release-binaries/*
          draft:      false
          prerelease: false
          body: |
            ## Hyperion Anti-Detect Browser ${{ steps.meta.outputs.tag }}

            **Chromium Core**: `${{ steps.meta.outputs.chrome_ver }}` — compiled from source with Hyperion fingerprint patch

            ### 📦 Packages
            | File | Platform |
            |------|----------|
            | `*.AppImage` | Linux (Universal Portable) |
            | `*.deb` | Debian / Ubuntu / Mint |
            | `*.rpm` | Fedora / RHEL / CentOS |
            | `*-Setup.exe` | Windows (NSIS Installer) |
            | `*-Portable.exe` | Windows (Portable) |
            | `hyperion-patches-and-fonts.tar.gz` | C++ source patches |

            **Integrity**: `SHA256SUMS.txt` included.
